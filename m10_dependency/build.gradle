plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.7'
}

group 'be.kdg.java2'
version '1.0-SNAPSHOT'

mainClassName='be.kdg.java2.Demo_13'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    implementation'org.hsqldb:hsqldb:2.5.0'
    implementation 'org.openjfx:javafx-controls:17' // You can change the version number
    implementation 'org.openjfx:javafx-fxml:17'     // based on your requirements

}
javafx {
    modules = [ 'javafx.controls' ]
    version = '17.0.2'
}

test {
    useJUnitPlatform()
}
sourceCompatibility = 17
